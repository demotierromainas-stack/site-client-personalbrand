# Construction du site et envoi chez Infomaniak.
#
# Trois déclencheurs, pour trois situations différentes :
#  - push sur main    : le code a changé (une section, un style, un correctif) ;
#  - repository_dispatch : le CONTENU a changé — c'est Directus qui appelle,
#    quand le client publie un article. Le code n'a pas bougé, mais le site
#    doit être reconstruit puisque les pages sont produites au build ;
#  - workflow_dispatch : relance manuelle depuis l'onglet Actions, utile pour
#    rejouer un déploiement sans rien modifier.

name: Déploiement

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [directus-publish]
  workflow_dispatch:

# Deux publications rapprochées ne doivent pas se déployer en parallèle : la
# seconde annule la première plutôt que de risquer d'arriver après elle et de
# remettre en ligne un état plus ancien.
concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  construire-et-deployer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Construire le site
        env:
          DIRECTUS_URL: ${{ secrets.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          # Signale au build qu'il tourne en intégration continue. Le repli sur
          # le cache local y est refusé : mieux vaut un déploiement en échec
          # qu'un site publié avec un contenu périmé, sans que personne ne le
          # remarque.
          CI: 'true'
        run: npm run build

      # Contrôle avant envoi : si Directus a renvoyé une liste vide — jeton
      # révoqué, collection renommée, tous les articles repassés en brouillon —
      # le build réussit quand même et produirait un site sans aucun article.
      # On préfère s'arrêter ici plutôt que d'effacer les articles en ligne.
      - name: Vérifier que le site contient bien des articles
        run: |
          nb=$(find dist/articles -name index.html 2>/dev/null | wc -l)
          echo "$nb page(s) article produite(s)"
          if [ "$nb" -eq 0 ]; then
            echo "::error::Aucune page article produite. Déploiement interrompu."
            exit 1
          fi

      # Déploiement par SSH plutôt que par FTP. Le FTP d'Infomaniak refusait
      # obstinément l'authentification, là où SSH fonctionnait déjà — et une
      # clé vaut mieux qu'un mot de passe dans des secrets : elle se révoque en
      # supprimant une ligne, et rien de réutilisable ailleurs ne circule.
      - name: Préparer la clé de déploiement
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      # Garde-fou avant un rsync --delete. Sans lui, une cible mal renseignée
      # (« ~ », « / ») effacerait tout l'hébergement, Directus et son .env
      # compris. On exige que le chemin désigne bien le dossier du site, et
      # qu'il existe déjà — rsync ne doit pas le créer.
      - name: Vérifier la cible du déploiement
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          case "$SSH_TARGET_DIR" in
            *jeanmaximehanny.fr|*jeanmaximehanny.fr/) ;;
            *) echo "::error::SSH_TARGET_DIR ($SSH_TARGET_DIR) ne désigne pas le dossier du site. Déploiement interrompu."; exit 1 ;;
          esac
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "test -d '$SSH_TARGET_DIR'" \
            || { echo "::error::Le dossier $SSH_TARGET_DIR n'existe pas sur le serveur."; exit 1; }

      - name: Déployer le site
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_TARGET_DIR: ${{ secrets.SSH_TARGET_DIR }}
        run: |
          rsync -rlz --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22}" \
            dist/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"

      # `--delete` retire du serveur ce qui n'est plus produit : la page
      # d'attente d'Infomaniak, et les articles dépubliés depuis Directus.
      - name: Vérifier que le site répond
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://jeanmaximehanny.fr/)
          echo "https://jeanmaximehanny.fr/ → HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Le site ne répond pas correctement après déploiement."; exit 1; }
