    <!-- Partie commune du <head>. Ce qui est propre à chaque page — titre,
         description, Open Graph, préchargement de l'image du hero — reste dans
         la page elle-même, juste avant cette inclusion. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07090f" />

    <meta property="og:locale" content="fr_FR" />

    <!-- Icônes — le monogramme « JMH » du header, que ce header écrit en texte :
         un onglet de navigateur et un résultat Google ne lisent pas le HTML, il
         leur faut des fichiers. Produits hors build par `npm run favicon`.

         Déclarés ici, donc sur les sept pages : un moteur retient une icône
         pour le site entier, mais il la cherche sur la page qu'il indexe, quelle
         qu'elle soit. favicon.ico empile 16, 32 et 48 px ; c'est le 48 que
         Google exige pour afficher autre chose qu'un globe gris à côté du
         résultat de recherche. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icone-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical, og:url, og:site_name et twitter:card, déduits de l'adresse
         de la page par le plugin « metadonnees-seo » (voir vite.config.js).
         Ne pas les réécrire dans les pages : une URL canonique copiée à la
         main finit toujours par désigner la mauvaise. -->
    <!--@seo-->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Marque le JS comme actif AVANT le premier rendu : les états initiaux
      // d'animation (opacity 0) sont conditionnés à cette classe, pour que la
      // page reste lisible si le JS ne charge pas.
      document.documentElement.classList.add('js-enabled');
    </script>

    <link rel="stylesheet" href="/src/styles/main.css" />
