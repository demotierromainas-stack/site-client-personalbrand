    <!-- ==========================================================
         HEADER — partagé par les quatre pages.

         Les liens d'ancre sont écrits en absolu (`/#articles`) et non en
         relatif (`#articles`) : depuis une page activité, une ancre seule
         chercherait une section qui n'existe pas sur cette page.

         L'état actif de la navigation n'est pas écrit en dur ici — il est posé
         par header.js à partir de l'URL, sinon ce partial devrait exister en
         quatre variantes.

         Les trois pages activité ne sont plus listées ici : on y arrive depuis
         la grille de l'accueil et depuis le footer.
         ========================================================== -->
    <header
      id="site-header"
      class="fixed top-0 right-0 left-0 z-50 border-b border-transparent transition-[background-color,backdrop-filter,border-color] duration-500"
    >
      <div class="mx-auto flex max-w-[1240px] items-center gap-10 px-6 py-5 lg:px-10">
        <a href="/" class="flex shrink-0 items-center gap-4">
          <span class="font-display text-3xl leading-none text-copper-400">JMH</span>
          <span class="eyebrow hidden text-bone-300 sm:block">Jean-Maxime Hanny</span>
        </a>

        <nav class="ml-auto hidden lg:block" aria-label="Navigation principale">
          <ul class="flex items-center gap-9">
            <li><a class="eyebrow nav-link" href="/#hero">À propos</a></li>
            <li><a class="eyebrow nav-link" href="/#articles">Articles</a></li>
            <li><a class="eyebrow nav-link" href="/#contact">Contact</a></li>
          </ul>
        </nav>

        <!-- TODO client : remplacer l'URL Calendly. Deux occurrences dans ce
             partial (ici et dans le menu mobile), deux autres dans footer.html. -->
        <a
          href="https://calendly.com/REMPLACER-PAR-LIEN-CLIENT"
          target="_blank"
          rel="noopener"
          class="eyebrow glass glass-hover ml-auto hidden items-center gap-3 px-6 py-3.5 text-bone-100 lg:ml-0 lg:flex"
        >
          Prendre rendez-vous
          <span aria-hidden="true">&rarr;</span>
        </a>

        <button
          type="button"
          id="menu-toggle"
          class="ml-auto lg:hidden"
          aria-expanded="false"
          aria-controls="mobile-nav"
        >
          <span class="sr-only">Ouvrir le menu</span>
          <span class="block h-px w-7 bg-bone-100"></span>
          <span class="mt-2 block h-px w-7 bg-bone-100"></span>
        </button>
      </div>

      <nav
        id="mobile-nav"
        class="hidden border-t border-white/5 bg-ink-900/95 backdrop-blur-lg lg:hidden"
        aria-label="Navigation mobile"
      >
        <ul class="flex flex-col px-6 py-4">
          <li><a class="eyebrow nav-link block py-3.5" href="/#hero">À propos</a></li>
          <li><a class="eyebrow nav-link block py-3.5" href="/#articles">Articles</a></li>
          <li><a class="eyebrow nav-link block py-3.5" href="/#contact">Contact</a></li>
          <li class="pt-3">
            <a
              href="https://calendly.com/REMPLACER-PAR-LIEN-CLIENT"
              target="_blank"
              rel="noopener"
              class="eyebrow glass flex items-center gap-3 px-6 py-3.5 text-bone-100"
            >
              Prendre rendez-vous <span aria-hidden="true">&rarr;</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>
